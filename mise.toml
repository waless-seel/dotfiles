[tools]
powershell = "latest"
fzf        = "latest"
fd         = "latest"
bat        = "latest"
rg         = "latest"
eza        = "latest"
zoxide     = "latest"
starship   = "latest"
delta      = "latest"
lazygit    = "latest"
node       = "lts"
ruby       = "latest"
python     = "3.13"
go         = "latest"
rust       = "latest"
uv         = "latest"
gh         = "latest"
claude     = "latest"
codex      = "latest"
gemini     = "latest"
"github:microsoft/apm" = "latest"
"github:zellij-org/zellij" = "latest"
"github:o2sh/onefetch" = "latest"

[env]
PYTHONUTF8 = 1

[settings]
python.uv_venv_auto = "create|source"

[tasks.doctor]
description = "インストール状態を診断"
run = ["mise doctor", "mise ls"]
