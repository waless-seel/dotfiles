[tools]
fzf      = "latest"
fd       = "latest"
bat      = "latest"
rg       = "latest"
eza      = "latest"
zoxide   = "latest"
starship = "latest"
delta    = "latest"
lazygit  = "latest"
node     = "lts"
ruby     = "latest"
python   = "3.13"
uv       = "latest"
